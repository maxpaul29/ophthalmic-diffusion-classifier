services:
  odc:
    image: ophthalmic-diffusion-classifier
    shm_size: '8gb'
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Reduces CUDA-OOM crashes caused by allocator fragmentation from
      # repeatedly switching between training and the sampling-heavy
      # evaluation/plotting phase (very different tensor lifetimes each time).
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PROJECT_ROOT=/workspace
      - DATA_PATH=${DATA_PATH:-/data}
      - CHECKPOINT_PATH=${CHECKPOINT_PATH:-/checkpoints}
      # Email notification on completion (see notify_email.py). Set these in
      # your .env file; if SMTP_USER/SMTP_PASSWORD are left unset, the
      # notification step is skipped without failing the run.
      - SMTP_HOST=${SMTP_HOST:-mail.gmx.net}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
    volumes:
      - .:/workspace
      - ${DATA_PATH:-./dataset/data}:/data
      - ${CHECKPOINT_PATH:-./checkpoints}:/checkpoints
    working_dir: /workspace
    # without notification: command: bash scripts/run.sh
    command: bash scripts/entrypoint_with_notify.sh
    stdin_open: true
    tty: true
